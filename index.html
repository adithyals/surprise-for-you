<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🦋</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--accent:#8e2232;--accent-d:#6a1524;--ink:#4a3a37;--cream:#f8e9df;--blush:#f2c9c4;--sage:#8f9870}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Playfair Display',serif;color:var(--ink);background:radial-gradient(ellipse at 50% 35%,#fcf1e9,#f8e8dd 65%,#f3dccf);background-color:#f8e9df;background-attachment:fixed;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.btn,.env,.card{touch-action:manipulation}
.script{font-family:'Dancing Script',cursive}
section{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative;z-index:2}
section.active{display:flex;animation:fade 1s ease}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2.6rem,10vw,4.8rem);font-weight:400;font-family:'Great Vibes','Dancing Script',cursive;color:var(--accent);text-shadow:0 4px 22px rgba(142,34,50,.15)}
h2{font-family:'Great Vibes','Dancing Script',cursive;font-weight:400;font-size:clamp(2.2rem,8vw,3.2rem);color:var(--accent);margin-bottom:24px}
p.sub{opacity:.85;margin:14px 0 30px;font-size:1.1rem}
button.btn{background:linear-gradient(135deg,#a82c40,#6a1524);color:#fff;border:none;padding:14px 34px;border-radius:50px;font-size:1.1rem;font-family:inherit;cursor:pointer;box-shadow:0 8px 24px rgba(106,21,36,.3);transition:transform .2s}
button.btn:hover{transform:scale(1.07)}
.heart-big{font-size:5rem;animation:beat 1.2s infinite;cursor:pointer;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.float{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}


/* ===== PAPER-CARD THEME: cream paper, lilies, balloons, ribbon ===== */
.d{position:fixed;z-index:0;pointer-events:none;height:auto}
.d.tl{top:0;left:0;width:clamp(120px,26vw,250px)}
.d.bl{bottom:0;left:0;width:clamp(130px,28vw,270px)}
.d.bow{top:8px;right:10px;width:clamp(62px,15vw,128px);transform:rotate(10deg);filter:drop-shadow(0 3px 5px rgba(120,60,70,.28))}
.d.bln{right:0;top:52%;width:clamp(54px,13vw,140px);transform-origin:50% 95%;animation:sway 7s ease-in-out infinite alternate}
.d.cake{bottom:0;right:0;width:clamp(86px,19vw,170px)}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.sp{position:fixed;z-index:0;pointer-events:none;width:16px;height:16px;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35;transform:scale(.75)}}
.cat{width:min(52vw,200px);height:auto;margin-bottom:8px;animation:hop 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(106,21,36,.2))}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){.d.bln,.sp,.cat{animation:none}}
@media(max-width:600px){section:not(#s2){padding-top:92px;padding-bottom:96px}}
@media(min-width:601px){.d.bln{top:24%}}

.env-wrap{position:relative;display:inline-block;margin-bottom:12px}
.env-wrap::before{content:"";position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(244,160,180,.75),rgba(244,170,190,.35) 40%,rgba(244,180,196,0) 68%);animation:blush 3s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes blush{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.75}}
.env{position:relative;z-index:1;display:block;width:min(26vw,100px);height:auto;cursor:pointer;filter:drop-shadow(0 12px 18px rgba(80,40,30,.38));animation:envpop .9s cubic-bezier(.2,1.5,.4,1) both,envbeat 2.2s ease-in-out .9s infinite;-webkit-tap-highlight-color:transparent;transition:filter .3s}
.env:hover{filter:drop-shadow(0 14px 22px rgba(142,34,50,.5)) brightness(1.05)}
@keyframes envpop{0%{opacity:0;transform:scale(.2) rotate(-14deg)}60%{opacity:1;transform:scale(1.22) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes envbeat{0%,100%{transform:scale(1) rotate(-2deg)}35%{transform:scale(1.1) rotate(2deg)}55%{transform:scale(1.03) rotate(0)}}
.env.opening{animation:envopen .8s ease-in forwards}
@keyframes envopen{0%{transform:scale(1)}18%{transform:scale(1.15) rotate(-10deg)}36%{transform:scale(1.2) rotate(10deg)}54%{transform:scale(1.3) rotate(-5deg)}100%{transform:scale(3.2) translateY(-30px);opacity:0}}
#s1 p.sub{animation:hint 2.4s ease-in-out infinite}
@keyframes hint{50%{opacity:.45}}
.mini-env{width:28px;height:auto;vertical-align:middle;margin-left:6px;position:relative;top:-1px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@media(prefers-reduced-motion:reduce){.env,.env-wrap::before,#s1 p.sub{animation:none}.env.opening{animation:none;opacity:0}}
.bear{height:1.05em;width:auto;vertical-align:-.2em;margin-left:.08em;filter:drop-shadow(0 3px 5px rgba(120,60,60,.25))}
.nav{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:28px}
button.btn.ghost{background:rgba(255,252,249,.85);color:var(--accent);border:1px solid rgba(142,34,50,.3);box-shadow:0 4px 14px rgba(106,21,36,.14)}
.h-cam{height:1.5em;width:auto;vertical-align:-.35em;margin-left:.1em;filter:drop-shadow(0 3px 5px rgba(80,50,30,.25))}.h-env{height:.95em;width:auto;vertical-align:-.14em;margin-left:.08em;filter:drop-shadow(0 3px 5px rgba(120,60,60,.28))}
/* ===== POSTER PAGE ===== */
#s2{padding:16px}
.poster{position:relative;width:min(100%,440px);height:min(calc(100vh - 32px),800px);border-radius:28px;overflow:hidden;background:#f3d6c3;box-shadow:0 25px 70px rgba(80,50,40,.35)}
@media(max-width:520px){#s2{padding:0}.poster{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.pbg{position:absolute;inset:0;overflow:hidden}
.bgp{position:absolute;overflow:hidden;background:linear-gradient(135deg,#f6cfb2,#e9a98a);filter:blur(5px);transform:scale(1.06);animation:drift 14s ease-in-out infinite alternate}
.bgp img{width:100%;height:100%;object-fit:cover;display:block}
.bgp img{filter:brightness(1.18) saturate(.85) contrast(.92)}
.bgp.a img{object-position:32% 50%}
.bgp.b img{object-position:45% 55%}
.bgp.c img{object-position:28% 30%}
.bgp.a{left:-14%;top:-3%;width:74%;height:58%}
.bgp.b{right:-9%;top:6%;width:48%;height:38%;animation-delay:-4s;background:linear-gradient(135deg,#f9d9bd,#eebb9f)}
.bgp.c{right:-11%;top:44%;width:54%;height:32%;animation-delay:-8s;background:linear-gradient(135deg,#f2dcc0,#e8b9a0)}
@keyframes drift{to{transform:scale(1.12) translate(6px,-6px)}}
.pbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,238,224,.38),rgba(255,226,206,.28))}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.6) 1.4px,transparent 1.7px);background-size:9px 9px;opacity:.55;pointer-events:none}
.main{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:98%;height:67%;display:flex;align-items:flex-end;justify-content:center;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateX(-50%) translateY(-8px)}}
.main img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;animation:pop 1.1s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.main img.cut{filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(3px 3px 0 #fff) drop-shadow(-3px -3px 0 #fff) drop-shadow(3px -3px 0 #fff) drop-shadow(-3px 3px 0 #fff) drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.main img.framed{border:8px solid #fff;border-radius:28px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.main .ph-main{width:78%;aspect-ratio:3/4;border:8px solid #fff;border-radius:28px;background:linear-gradient(135deg,#f6cfb2,#e7a58c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:3rem;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.ph-main small{font-size:.8rem;font-family:'Playfair Display',serif;color:#fff;opacity:.9;padding:0 10px}
.fade{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(to top,#fff 40%,rgba(255,255,255,.92) 54%,rgba(255,255,255,0));pointer-events:none}
.stk{position:absolute;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.stk.bf{left:5%;top:5%;width:24%;transform:rotate(-14deg);animation:flap 4s ease-in-out infinite}
.stk.pl{right:0;top:34%;width:33%;opacity:.95;animation:bob 5s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(-6deg) translateY(-8px) scale(1.05)}}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.ptext{position:absolute;left:0;right:0;bottom:5%;z-index:4;padding:0 7%}
.happy{font-family:'Cinzel Decorative',serif;font-weight:700;color:var(--accent);font-size:clamp(1.1rem,5vw,1.5rem);letter-spacing:.06em;text-align:left;padding-left:4%}
.bday{font-family:'Cinzel Decorative',serif;font-weight:900;color:var(--accent);font-size:clamp(2rem,11vw,3.1rem);line-height:1.05;letter-spacing:.01em;white-space:nowrap;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.pname{font-family:'Great Vibes','Dancing Script',cursive;font-weight:400;color:var(--accent);font-size:clamp(2.2rem,10vw,3.1rem);text-align:right;padding-right:4%;margin-top:2px}
.pbtn{margin-top:0;padding:10px 18px;font-size:.95rem;white-space:nowrap}
.ptext .nav{margin-top:14px;flex-wrap:nowrap;gap:10px}

/* letter */
.letter{width:100%;max-width:560px;font-size:1.05rem;line-height:1.8;text-align:left;cursor:pointer;filter:drop-shadow(0 12px 18px rgba(80,50,30,.18))}
.letter .nw{white-space:nowrap}.letter .ins[src*="cake"]{height:1.9em;vertical-align:-.45em}.letter .ins{height:1.25em;width:auto;vertical-align:-.3em;margin-left:.2em;position:static;filter:drop-shadow(0 2px 3px rgba(80,50,30,.25))}.letter .nt,.letter .nb{display:block;width:100%;height:auto}.letter .nt{margin-bottom:-1px}.letter .nb{margin-top:-1px}
.letter .nm{background:url(images/note_mid.png) top center/100% auto repeat-y;padding:0 13% 0 14%;white-space:pre-wrap;color:#4a3328}
.cursor{display:inline-block;width:2px;background:var(--accent);margin-left:2px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;max-width:900px;width:100%}
.card{height:clamp(340px,96vw,380px);perspective:800px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;filter:drop-shadow(0 8px 10px rgba(80,50,30,.28));display:flex;align-items:center;justify-content:center;padding:18px;backface-visibility:hidden}
.card .fe{height:150px;width:auto;margin:0;filter:drop-shadow(0 4px 6px rgba(80,50,30,.25))}.card .ft{font-family:'Great Vibes',cursive;font-size:1.9rem;line-height:1.2;color:#fff}.card .bh{font-family:'Great Vibes',cursive;font-size:1.45rem;line-height:1.2;color:var(--accent);margin-bottom:8px}.card .bt{max-height:100%;overflow:hidden}.card .f{text-align:center;background:url(images/tag.png) center/100% 100% no-repeat;border-radius:0;font-size:2.4rem}.card .f .fe{margin-top:16%}
.card .b{background:url(images/tag.png) center/100% 100% no-repeat;border:0;border-radius:0;padding:24% 11% 7% 19%;transform:rotateY(180deg);font-size:clamp(.76rem,3.6vw,.88rem);line-height:1.45;color:var(--ink)}
/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;max-width:960px;width:100%}
.ph{aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#f6cfb2,#e7a58c);display:flex;align-items:center;justify-content:center;font-size:3rem;border:6px solid #fff;box-shadow:0 10px 30px rgba(80,50,40,.25);transform:rotate(var(--r))}
.ph img{width:100%;height:100%;object-fit:cover}
.final{font-size:clamp(1.3rem,4vw,1.8rem);max-width:600px;line-height:1.7;color:var(--ink)}
.mute{position:fixed;top:14px;right:14px;z-index:10;background:rgba(142,34,50,.15);border:none;color:var(--accent-d);width:42px;height:42px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:none}
canvas{position:fixed;inset:0;pointer-events:none;z-index:50}

@media(max-width:600px){section{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}}
@media(max-width:360px){h1,h2{font-size:clamp(1.7rem,9vw,2.2rem)!important}.pbtn{padding:10px 14px;font-size:.9rem}}
@media(max-height:560px) and (orientation:landscape){#s2{padding:0}#s2{justify-content:flex-start}.poster{width:min(100%,440px);height:640px;border-radius:0}section:not(#s2){padding-top:70px;padding-bottom:70px}}
</style>
</head>

<button class="mute" id="mute" title="Music on/off">🎵</button>

<!-- 1. INTRO -->
<section id="s1" class="active">
  <div class="env-wrap"><img class="env" id="open" src="images/envelope.png" alt="Sealed envelope. Tap to open" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'heart-big',id:'open',textContent:'💌'}));bindOpen()"></div>
  <h1 id="introTitle">Hey 😊</h1>
  <p class="sub">I made something special for you. Tap the envelope to open it.</p>
</section>

<!-- 2. BIRTHDAY POSTER -->
<section id="s2">
  <div class="poster">
    <div class="pbg" id="pbg"></div>
    <div class="dots"></div>
    <div class="main" id="main"></div>
    <svg class="stk bf" viewBox="0 0 120 100" aria-hidden="true">
      <g stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <path fill="rgba(45,45,50,.85)" d="M58 48 C40 10 8 6 6 30 C5 48 22 56 40 56 C26 62 22 80 36 88 C48 94 56 74 58 58 Z"/>
        <path fill="rgba(45,45,50,.85)" d="M62 48 C80 10 112 6 114 30 C115 48 98 56 80 56 C94 62 98 80 84 88 C72 94 64 74 62 58 Z"/>
        <path fill="none" stroke-width="3" d="M59 44 C56 30 52 26 48 20 M61 44 C64 30 68 26 72 20"/>
      </g>
      <g fill="rgba(255,255,255,.55)"><circle cx="30" cy="30" r="6"/><circle cx="90" cy="30" r="6"/><circle cx="34" cy="72" r="4"/><circle cx="86" cy="72" r="4"/></g>
      <rect x="57.5" y="42" width="5" height="34" rx="2.5" fill="#fff"/>
    </svg>
    <svg class="stk pl" viewBox="0 0 160 110" aria-hidden="true">
      <circle cx="80" cy="55" r="33" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="4"/>
      <ellipse cx="80" cy="58" rx="74" ry="19" fill="none" stroke="#fff" stroke-width="6" transform="rotate(-18 80 58)"/>
      <ellipse cx="80" cy="58" rx="74" ry="19" fill="none" stroke="rgba(90,95,105,.55)" stroke-width="2" transform="rotate(-18 80 58)"/>
    </svg>
    <div class="fade"></div>
    <div class="ptext">
      <div class="happy">Happy</div>
      <div class="bday">BIRTHDAY</div>
      <div class="pname" id="pname">Gurl</div>
      <div class="nav"><button class="btn ghost pbtn" id="back2">← Back</button><button class="btn pbtn" id="next2">Continue <img class="mini-env" src="images/envelope.png" alt="" onerror="this.replaceWith('💌')"></button></div>
    </div>
  </div>
</section>

<!-- 3. LETTER -->
<section id="s3">
  <h2>A little note for you <img class="h-env" src="images/envelope.png" alt="" onerror="this.replaceWith('💌')"></h2>
  <div class="letter"><img class="nt" src="images/note_top.png" alt=""><div class="nm"><span id="typed"></span><span class="cursor">&nbsp;</span></div><img class="nb" src="images/note_bot.png" alt=""></div>
  <div class="nav"><button class="btn ghost" id="back3">← Back</button><button class="btn" id="next3" style="display:none">Keep going →</button></div>
</section>

<!-- 4. REASONS -->
<section id="s4">
  <h2>Reasons that make you special</h2>
  <p class="sub">Tap each card to flip it.</p>
  <div class="cards" id="cards"></div>
  <div class="nav"><button class="btn ghost" id="back4">← Back</button><button class="btn" id="next4">Next →</button></div>
</section>

<!-- 5. GALLERY -->
<section id="s5">
  <h2>Little moments <img class="h-cam" src="images/camera.png" alt="" onerror="this.replaceWith('📸')"></h2>
  <div class="gallery" id="gallery"></div>
  <div class="nav"><button class="btn ghost" id="back5">← Back</button><button class="btn" id="next5">One last thing →</button></div>
</section>

<!-- 6. FINAL -->
<section id="s6">
  <img class="cat" src="images/cat.png" alt="A kitten in a party hat holding a cake and tulips">
  <h1 id="finalTitle">Happy Birthday!</h1>
  <p class="final script" id="finalMsg"></p>
  <div class="nav"><button class="btn ghost" id="back6">← Back</button><button class="btn" id="again">🎉 More confetti</button></div>
</section>

<audio id="song" loop preload="auto"></audio>

<script>
/* ========= EDIT THIS PART ========= */
const CONFIG = {
  // ----- Birthday poster page (page 2) -----
  posterMain: "images/main.png",   // her main photo. A transparent PNG cut-out gets the white sticker outline automatically
  posterTag: "Gurl",               // text under BIRTHDAY on the poster page
  posterCutout: true,              // true = add the white sticker outline (main.png is a transparent cut-out). false = rounded photo frame
  posterBg: ["images/bg1.jpg","images/bg2.jpg","images/bg3.jpg"],   // 3 photos shown blurred in the background
  herName: "Rashmitha",        // her name
  yourName: "Your Name",       // your name
  song: "",                    // optional music: put an mp3 next to index.html and write its name, e.g. "song.mp3"
  letter:
`Once again, Happy Birthday! {{hc}}

I hope your special day is filled with endless smiles, beautiful surprises, and all the happiness your heart deserves.

One thing I genuinely admire about you is how real and genuine you are. You never pretend to be someone else, and you always care about people's feelings. You have such a kind heart, and you never want to be the reason someone gets hurt. Never lose that beautiful part of yourself because it's one of the things that makes you truly special.

I genuinely wish that life gives you countless reasons to smile, opportunities to achieve everything you've dreamed of, and people who always make you feel valued and appreciated.

Never stop being the cheerful, crazy, unique, and wonderful person you are. Keep smiling, keep shining, and never let anything take away that beautiful happiness from you.

May this new chapter of your life bring you more confidence, unforgettable memories, exciting adventures, and dreams turning into reality.

And one thing I truly wish for you is that whenever you look back at this year, you have a thousand beautiful reasons to smile.

Stay happy, stay blessed, and keep being YOU! {{heart}}`,
  reasons: [
    {t:"Your soft-hearted nature", d:"You sometimes try to act like a rude person, but deep down, you're such a soft-hearted person. That's something I've observed about you, and honestly, it's one of the sweetest things about your character."},
    {t:"Your emotional maturity", d:"Before making decisions, you think about the future and consider how your choices might affect others. You don't simply give someone false hope when you're unsure. You prefer being genuine and honest, and that's something I truly admire about you."},
    {t:"Your patience and understanding", d:"Sometimes I know I test your patience, but the way you handle those situations is genuinely admirable. You stay calm and handle things with so much maturity. Patience and understanding are beautiful qualities, and you carry them so naturally. That's another thing I truly appreciate about you."},
    {t:"Your amazing talent", d:"You are genuinely talented, especially when it comes to dance. I don't know whether you plan to continue pursuing dance as a career or not, but whatever path you choose, I'll always be cheering for you. No matter where life takes you, I'll always be your biggest fan. Keep believing in yourself."}
  ],
  // put photos in an "images" folder and list them here, e.g. "images/1.jpg"
  photos: ["images/1.jpg","images/2.jpg","images/3.jpg","images/4.jpg"],
  finalMessage: "Keep smiling, keep shining, and keep being YOU! 🎂"
};
/* ================================== */

const $ = id => document.getElementById(id);
const fill = s => s.replaceAll("{her}",CONFIG.herName).replaceAll("{you}",CONFIG.yourName);
const go = n => { document.querySelectorAll("section").forEach(s=>s.classList.remove("active")); $("s"+n).classList.add("active"); window.scrollTo(0,0); };

$("introTitle").innerHTML = "Hey " + CONFIG.herName + ` <img class="bear" src="images/bear.png" alt="" onerror="this.replaceWith('😊')">`;
$("pname").textContent = CONFIG.posterTag;
$("finalTitle").textContent = "Happy Birthday, " + CONFIG.herName + "!";
$("finalMsg").textContent = fill(CONFIG.finalMessage);

/* floating butterflies & sparkles */
setInterval(()=>{
  const e=document.createElement("div");
  e.className="float"; e.textContent=["🌸","✨","🎈","🤍","🌷"][Math.floor(Math.random()*5)];
  e.style.left=Math.random()*100+"vw"; e.style.fontSize=(14+Math.random()*22)+"px";
  e.style.animationDuration=(6+Math.random()*6)+"s";
  document.body.appendChild(e); setTimeout(()=>e.remove(),12000);
},600);

/* music */
const song=$("song");
if(CONFIG.song){ song.src=CONFIG.song; $("mute").style.display="block"; }
$("mute").onclick=()=>{ if(song.paused){song.play();$("mute").textContent="🎵"} else {song.pause();$("mute").textContent="🔇"} };

/* confetti */
const cv=$("confetti"),cx=cv.getContext("2d");let parts=[],running=false;
const COLORS=["#8e2232","#e8a5a5","#f4c9c0","#b7b78a","#d9a066","#c4495d"];
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener("resize",fit);
function burst(n=180){
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,
    s:5+Math.random()*7,c:COLORS[Math.floor(Math.random()*COLORS.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  if(!running){running=true;loop()}
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  parts=parts.filter(p=>p.y<cv.height+20);
  if(parts.length) requestAnimationFrame(loop); else {running=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* poster page */
function isCutout(img){
  if(CONFIG.posterCutout===true||CONFIG.posterCutout===false) return CONFIG.posterCutout;
  try{
    const c=document.createElement("canvas");c.width=c.height=32;
    const x=c.getContext("2d");x.drawImage(img,0,0,32,32);
    return [[0,0],[31,0],[0,31],[31,31]].every(([a,b])=>x.getImageData(a,b,1,1).data[3]<10);
  }catch(e){return false}
}
["a","b","c"].forEach((k,i)=>{
  const d=document.createElement("div");d.className="bgp "+k;
  const src=CONFIG.posterBg[i];
  if(src){const im=new Image();im.alt="";im.onerror=()=>im.remove();im.src=src;d.appendChild(im)}
  $("pbg").appendChild(d);
});
(function(){
  const m=new Image();m.alt="";
  m.onload=()=>{m.className=isCutout(m)?"cut":"framed";$("main").appendChild(m)};
  m.onerror=()=>{$("main").innerHTML='<div class="ph-main">🦋<small>Add your photo as '+CONFIG.posterMain+'</small></div>'};
  m.src=CONFIG.posterMain;
})();

/* step 1 -> 2 */
let opening=false;
function bindOpen(){ $("open").onclick=()=>{
  if(opening) return; opening=true;
  if(CONFIG.song) song.play().catch(()=>{});
  $("open").classList.add("opening"); document.querySelector(".env-wrap").classList.add("opening");
  setTimeout(()=>burst(160),380);
  setTimeout(()=>go(2),820);
}; }
bindOpen();
$("next2").onclick=()=>{ go(3); type(); };

/* typewriter */
let typeIv=null,letterDone=false;
const STK={hc:'<span class="nw"><img class="ins" src="images/heart.png" alt=""><img class="ins" src="images/cake.png" alt=""></span>',heart:'<img class="ins" src="images/heart.png" alt="">',cake:'<img class="ins" src="images/cake.png" alt="">'};
const esc=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const units=t=>t.match(/\{\{(?:heart|cake|hc)\}\}|[\s\S]/gu)||[];
const html=u=>u.map(x=>x.startsWith("{{")?STK[x.slice(2,-2)]:esc(x)).join("");
function type(){
  clearInterval(typeIv);
  const u=units(fill(CONFIG.letter));
  const show=()=>{clearInterval(typeIv);letterDone=true;$("typed").innerHTML=html(u);$("next3").style.display="inline-block"};
  document.querySelector(".letter").onclick=show;
  if(letterDone||!u.length){show();return}
  let i=0;$("typed").innerHTML="";
  typeIv=setInterval(()=>{ i++; $("typed").innerHTML=html(u.slice(0,i)); if(i>=u.length) show() },22);
}
$("next3").onclick=()=>go(4);

/* back buttons */
function resetEnvelope(){ $("open").classList.remove("opening"); document.querySelector(".env-wrap").classList.remove("opening"); opening=false; }
$("back2").onclick=()=>{ resetEnvelope(); go(1); };
$("back3").onclick=()=>go(2);
$("back4").onclick=()=>go(3);
$("back5").onclick=()=>go(4);
$("back6").onclick=()=>go(5);

/* reasons */
CONFIG.reasons.forEach(r=>{
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="in"><div class="f"><div><img class="fe" src="images/bunny.png" alt="" onerror="this.replaceWith('🌸')"></div></div><div class="b"><div class="bt"><div class="bh">${r.t}</div>${r.d}</div></div></div>`;
  d.onclick=()=>d.classList.toggle("flip"); $("cards").appendChild(d);
});
$("next4").onclick=()=>go(5);

/* gallery */
CONFIG.photos.forEach((p,i)=>{
  const d=document.createElement("div");d.className="ph";d.style.setProperty("--r",((i%2?1:-1)*(1+Math.random()*2))+"deg");
  const img=new Image();img.src=p;img.alt="memory";
  img.onerror=()=>{d.textContent="🌸";img.remove()};
  d.appendChild(img);$("gallery").appendChild(d);
});
$("next5").onclick=()=>{go(6);burst(250)};
$("again").onclick=()=>burst(300);
</script>
</body>
</html>
